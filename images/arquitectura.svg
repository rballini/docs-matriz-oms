<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" viewBox="0 0 720 160" role="img" aria-label="Tu sistema se conecta por REST y WebSocket a Matriz OMS API, que se conecta por FIX a Primary Trading Platform de A3 Mercados">
