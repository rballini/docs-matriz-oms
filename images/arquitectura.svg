  </defs>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="10" y="40" width="180" height="80" rx="12" fill="#FFFFFF" stroke="#111D4A" stroke-width="2"/>
    <text x="100" y="76" font-size="16" font-weight="700" fill="#111D4A">Tu sistema</text>
    <text x="100" y="98" font-size="12" fill="#0B132B">ALyC · institución · integrador</text>

